plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ksck.signbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.ksck.signbridge"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // This standalone LSPosed module has no distribution keystore.
            // Use the locally generated debug key so the CI artifact is installable.
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
