plugins {
    id 'com.android.application'
}

def keystoreProperties = [
    storeFile: file("$rootDir/keystore/ksck-release.jks"),
    storePassword: "ksck123456",
    keyAlias: "ksck",
    keyPassword: "ksck123456"
]

android {
    namespace 'com.ksck.signbridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.ksck.signbridge"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile keystoreProperties.storeFile
            storePassword keystoreProperties.storePassword
            keyAlias keystoreProperties.keyAlias
            keyPassword keystoreProperties.keyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
